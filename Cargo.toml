[package]
name = "bevy_declarative_plugins"
version = "0.0.1"
edition = "2024"
authors = ["Fallible Things"]
license = "MIT OR Apache-2.0"
description = "Dependencies (and other cool features) for bevy plugins, via a declarative API."
keywords = ["bevy", "plugin", "declarative", "gamedev"]
categories = ["game-development"]
readme = "README.md"
repository = "https://github.com/CreativeBevians/bevy_declarative_plugins"
homepage = "https://github.com/CreativeBevians/bevy_declarative_plugins"

[features]
default = ["state"]
state = ["dep:bevy_state"]

[dependencies]
bevy_app = {version = "0.20.0"}
bevy_state = {version = "0.20.0", optional = true}
bevy_ecs = "0.20.0"
bevy_platform = "0.20.0"

[dev-dependencies]
bevy = {version = "0.20"}